# Boot menu of the GraveyardOS live medium (BIOS and UEFI).
# @LABEL@, @VERSION@ and @CMDLINE@ are filled in by iso/build.sh.

set default=0
set timeout=10
set menu_color_normal=white/black
set menu_color_highlight=black/light-magenta

# A graphics mode for the kernel's first console (on UEFI there is no text
# mode once the firmware is left).
insmod all_video

search --no-floppy --set=root --label @LABEL@

# The GraveyardOS look (branding/grub): black, white, the tomb. Without a
# graphics mode, the plain text menu above stays.
insmod gfxterm
insmod png
set gfxmode=1920x1080x32,1280x800x32,1024x768x32,auto
loadfont ($root)/boot/grub/themes/graveyard/rubik-16.pf2
if terminal_output gfxterm; then
    loadfont ($root)/boot/grub/themes/graveyard/rubik-24.pf2
    loadfont ($root)/boot/grub/themes/graveyard/rubik-bold-40.pf2
    set theme=($root)/boot/grub/themes/graveyard/theme.txt
fi

menuentry "GraveyardOS @VERSION@ live" --id graveyard {
    linux /boot/vmlinuz graveyard.live=@LABEL@ @CMDLINE@
    initrd /boot/initramfs.img
}

# For a screen that stays black or garbled: no graphics driver, the
# firmware's display is used as it is.
menuentry "GraveyardOS @VERSION@ live (safe graphics)" --id graveyard-safe {
    linux /boot/vmlinuz graveyard.live=@LABEL@ nomodeset @CMDLINE@
    initrd /boot/initramfs.img
}

# @NVIDIA-BEGIN (kept by iso/build.sh when the medium has /graveyard/nvidia.sfs)
# NVIDIA cards: the open kernel modules and NVIDIA's own driver, instead
# of nouveau.
menuentry "GraveyardOS @VERSION@ live (NVIDIA)" --id graveyard-nvidia {
    linux /boot/vmlinuz graveyard.live=@LABEL@ graveyard.nvidia=1 modprobe.blacklist=nouveau nvidia-drm.modeset=1 @CMDLINE@
    initrd /boot/initramfs.img
}
# @NVIDIA-END

if [ "${grub_platform}" = efi ]; then
    menuentry "UEFI firmware settings" --id firmware {
        fwsetup
    }
fi
menuentry "Restart" --id restart {
    reboot
}
menuentry "Power off" --id poweroff {
    halt
}
