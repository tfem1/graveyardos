# What an arch-build pass left: the failures grouped by their last log line,
# and the end of the logs of some packages (the artifacts, in the log).
name: arch-report

on:
  workflow_dispatch:
    inputs:
      run:
        description: "arch-build run id"
        required: true
      logs:
        description: "packages whose log end to print (space separated)"
        default: ""
      grep:
        description: "a pattern to look for in every log (with 3 lines around)"
        default: ""
      shard:
        description: "arch-wave: read this shard's artifact instead (its new packages, failures and logs); all: every shard's"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.shard == ''
        with:
          name: arch-repo
          path: work
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.shard == ''
        with:
          name: arch-logs
          path: .
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.shard == 'all'
        with:
          pattern: shard-*
          path: shards
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Every shard together
        if: inputs.shard == 'all'
        run: |
          mkdir -p work/logs
          for d in shards/*/; do
            cat "$d/failed" >> work/failed 2> /dev/null || true
            cp "$d"/logs/*.log work/logs/ 2> /dev/null || true
          done
      - uses: actions/download-artifact@v4
        if: inputs.shard != '' && inputs.shard != 'all'
        with:
          name: shard-${{ inputs.shard }}
          path: work
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: A shard's layout
        if: inputs.shard != ''
        run: |
          mkdir -p work/repo && cp -r work/logs . && tar -czf arch-logs.tar.gz logs && touch work/done
      - name: Report
        run: |
          tar -xzf arch-logs.tar.gz
          ls logs | head -50
          echo "done: $(grep -c . work/done)  failed: $(grep -c . work/failed)  packages: $(ls work/repo/*.yon 2> /dev/null | wc -l)"
          echo "== failures by cause (normalised last line)"
          cut -f2- work/failed | sed -E 's/[0-9a-f]{12,}//g; s/[0-9]+(\.[0-9]+)+/N/g; s/\/[^ :]*\//\/...\//g' \
            | cut -c1-110 | sort | uniq -c | sort -rn | head -n 60
          echo "== every failure"
          cut -c1-220 work/failed
          echo "== done: $(tr '\n' ' ' < work/done)"
          if [ -n "${{ inputs.grep }}" ]; then
            echo "== logs matching ${{ inputs.grep }}"
            grep -n -B3 -A3 -E "${{ inputs.grep }}" logs/*.log | cut -c1-220 | head -n 150 || true
          fi
          for p in ${{ inputs.logs }}; do
            echo "== $p: done=$(grep -cx "$p" work/done) failed=$(grep -c "^$p	" work/failed) packages: $(ls work/repo 2> /dev/null | grep "^$p-[0-9]" | grep -v sig | tr '\n' ' ')"
            grep "^$p	" work/made work/partial 2> /dev/null || true
            echo "== log of $p"
            tail -n 40 "logs/$p.log" 2> /dev/null | cut -c1-220 || echo "(no log)"
          done
