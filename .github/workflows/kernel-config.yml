# Fetches the base kernel configuration (Arch Linux's, same kernel series as
# the book) and commits it to main (one commit: its diff is what to review).
# Builds only ever use the committed kernel/base.config.
name: kernel-config

on:
  workflow_dispatch:

permissions:
  contents: write  # commit the configuration to main

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: |
          version=$(sed -n 's|.*/linux-\([0-9.]*\)\.tar\.xz$|\1|p' lfs/wget-list)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash kernel/fetch-base-config.sh "$version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the result to main (its diff is the review)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add kernel/base.config kernel/base.config.source
          git commit -m "kernel: base configuration for Linux $VERSION" \
            -m "Fetched by the kernel-config workflow, run ${{ github.run_id }}."
          git push origin HEAD:main
          echo "committed to main: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
