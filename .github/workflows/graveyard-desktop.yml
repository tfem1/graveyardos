# GraveyardOS-kde and GraveyardOS-hyprland: the base system (a graveyard-base
# artifact), the edition's packages built by arch-build (an arch-repo
# artifact) installed with Yone, the desktop set up (iso/desktop.sh), then the
# ISO, booted in QEMU until the live user's desktop is up, with a picture of it.
name: graveyard-desktop

on:
  workflow_dispatch:
    inputs:
      base_run:
        description: "Run id whose graveyard-base artifact is the base system"
        type: string
        required: true
      arch_run:
        description: "Run id of an arch-build pass (its arch-repo artifact: the packages)"
        type: string
        required: true
      edition:
        description: "Edition"
        type: choice
        options: [kde, hyprland]
        default: kde
      partial:
        description: "Install what is built of the edition and list what is missing (a trial image)"
        type: boolean
        default: false
      nvidia:
        description: "Add the NVIDIA layer (open modules + nvidia-utils) and its boot entry"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  LFS: /mnt/lfs

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / /mnt

      - uses: actions/download-artifact@v4
        with:
          name: graveyard-base
          path: ${{ runner.temp }}
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}

      - name: Restore $LFS
        run: |
          sudo -E bash lfs/build.sh unpack "$RUNNER_TEMP"/graveyard-base.tar.zst
          sudo rm -f "$RUNNER_TEMP"/graveyard-base.tar.zst
          sudo mkdir -p "$LFS/sources"
          sudo bash lfs/graveyard/fetch-sources.sh "$LFS/sources"
          sudo ln -sf bash /bin/sh

      # the system's configuration and the live session's files as this
      # commit has them (os-release, installer...), before the desktop adds its own
      - name: Initramfs section again
        run: sudo -E GRAVEYARD_REDO="graveyard-base-files graveyard-initramfs" bash lfs/build.sh run ch09 ch10

      - uses: actions/download-artifact@v4
        with:
          name: arch-repo
          path: /mnt/arch-work
          run-id: ${{ inputs.arch_run }}
          github-token: ${{ github.token }}

      - name: Yone (static)
        timeout-minutes: 20   # a minute normally; a stuck runner must not eat the pass
        working-directory: yone
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools > /dev/null
          cargo build --release --target x86_64-unknown-linux-musl
          echo "YONE=$PWD/target/x86_64-unknown-linux-musl/release/yone" >> "$GITHUB_ENV"

      - name: The ${{ inputs.edition }} desktop
        run: |
          set -o pipefail
          sudo -E YONE="$YONE" GRAVEYARD_PARTIAL=${{ inputs.partial && '1' || '0' }} \
            bash iso/desktop.sh ${{ inputs.edition }} /mnt/arch-work | tee "$RUNNER_TEMP/desktop.txt"
          {
            echo "## GraveyardOS-${{ inputs.edition }}"
            echo '```'
            grep -E '==>|not built yet|^   ' "$RUNNER_TEMP/desktop.txt" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The NVIDIA layer
        if: inputs.nvidia
        run: |
          set -o pipefail
          if ls /mnt/arch-work/repo/nvidia-utils-*.yon > /dev/null 2>&1; then
            sudo -E bash iso/nvidia.sh /mnt/arch-work | tee "$RUNNER_TEMP/nvidia.txt"
            { echo '### NVIDIA layer'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/nvidia.txt" | grep -E '==>|^   ' | head -n 30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nvidia-utils is not built yet: no NVIDIA layer on this image" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the ISO
        run: |
          sudo rm -rf /mnt/arch-work
          sudo apt-get install -y -qq squashfs-tools xorriso mtools dosfstools qemu-system-x86 ovmf > /dev/null
          sudo -E GRAVEYARD_EDITION=${{ inputs.edition }} bash iso/build.sh "$RUNNER_TEMP/iso" | tee "$RUNNER_TEMP/iso-build.txt"
          sudo chmod -R a+rX "$RUNNER_TEMP/iso"
          {
            echo '```'
            grep -A3 'GraveyardOS-.*\.iso$' "$RUNNER_TEMP/iso-build.txt" | sed 's/\x1b\[[0-9;]*m//g'
            cat "$RUNNER_TEMP"/iso/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GraveyardOS-${{ inputs.edition }}
          path: |
            ${{ runner.temp }}/iso/*.iso
            ${{ runner.temp }}/iso/*.sha256
          compression-level: 0
          retention-days: 14

      - name: KVM for the virtual machine
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: the desktop runs emulated (slow)"

      - name: Boot it to the desktop (UEFI disc, BIOS USB stick)
        run: |
          GRAVEYARD_DESKTOP=${{ inputs.edition }} GRAVEYARD_BOOT_CASES="uefi-disc bios-usb" \
            bash iso/boot-test.sh "$(ls "$RUNNER_TEMP"/iso/GraveyardOS-*.iso)" "$RUNNER_TEMP/boot"

      # The same ISO from a stick prepared with the current Ventoy release,
      # booted to the desktop with both firmwares (iso/ventoy-stick.sh)
      - name: Boot it to the desktop from a Ventoy stick (BIOS and UEFI)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq exfatprogs > /dev/null
          iso=$(ls "$RUNNER_TEMP"/iso/GraveyardOS-*.iso)
          sudo GH_TOKEN="$GH_TOKEN" bash iso/ventoy-stick.sh "$iso" "$RUNNER_TEMP/ventoy.img"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/ventoy.img"
          echo "Ventoy $(cat "$RUNNER_TEMP/ventoy.img.ventoy-version")" >> "$GITHUB_STEP_SUMMARY"
          GRAVEYARD_DESKTOP=${{ inputs.edition }} GRAVEYARD_VENTOY_IMG="$RUNNER_TEMP/ventoy.img" \
            GRAVEYARD_BOOT_CASES="uefi-ventoy bios-ventoy" bash iso/boot-test.sh "$iso" "$RUNNER_TEMP/boot"
          rm -f "$RUNNER_TEMP/ventoy.img"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GraveyardOS-${{ inputs.edition }}-boot
          path: |
            ${{ runner.temp }}/boot/*.png
            ${{ runner.temp }}/boot/*.report
            ${{ runner.temp }}/boot/*.console
          if-no-files-found: ignore
          retention-days: 14
